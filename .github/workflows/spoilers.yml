name: MTG Spoilers

on:
  schedule:
    - cron: "7,27,47 * * * *"   # every 20 minutes, offset from the busy top of the hour
  workflow_dispatch:             # lets you run it manually from the Actions tab

permissions:
  contents: write                # needed to save seen.json back to the repo
  actions: read                  # lets the failure alert look at recent runs

concurrency:
  group: spoilers
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main              # always use the latest repo state, even on re-runs

      - name: Post new spoilers
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 spoiler_bot.py

      - name: Post new deals
        continue-on-error: true      # deals problems never block spoilers
        env:
          DEALS_DISCORD_WEBHOOK_URL: ${{ secrets.DEALS_DISCORD_WEBHOOK_URL }}
          TOURNAMENTS_WEBHOOK_URL: ${{ secrets.TOURNAMENTS_WEBHOOK_URL }}
        run: python3 deals_bot.py

      - name: Post Arena daily deals
        continue-on-error: true
        env:
          DEALS_DISCORD_WEBHOOK_URL: ${{ secrets.DEALS_DISCORD_WEBHOOK_URL }}
        run: python3 arena_deals_bot.py

      - name: Post Pokémon GO events
        continue-on-error: true
        env:
          POKEMON_GO_WEBHOOK_URL: ${{ secrets.POKEMON_GO_WEBHOOK_URL }}
        run: python3 pogo_bot.py

      - name: Post free games
        continue-on-error: true
        env:
          FREE_GAMES_WEBHOOK_URL: ${{ secrets.FREE_GAMES_WEBHOOK_URL }}
        run: python3 free_games_bot.py

      - name: Post news feeds
        continue-on-error: true
        env:
          GAMING_NEWS_WEBHOOK_URL: ${{ secrets.GAMING_NEWS_WEBHOOK_URL }}
          GUNPLA_NEWS_WEBHOOK_URL: ${{ secrets.GUNPLA_NEWS_WEBHOOK_URL }}
          MTG_NEWS_WEBHOOK_URL: ${{ secrets.MTG_NEWS_WEBHOOK_URL }}
        run: python3 rss_bot.py

      - name: Game (XP, scoreboard, meal plan)
        continue-on-error: true
        env:
          GAME_ICS_URL: ${{ secrets.GAME_ICS_URL }}
          GAME_WEBHOOK_URL: ${{ secrets.GAME_WEBHOOK_URL }}
          MEALPLAN_WEBHOOK_URL: ${{ secrets.MEALPLAN_WEBHOOK_URL }}
          GUIDES_WEBHOOK_URL: ${{ secrets.GUIDES_WEBHOOK_URL }}
        run: |
          pip install -q recurring-ical-events || echo "iCal libraries unavailable"
          python3 game_bot.py

      - name: Post hub (today + shiny dex)
        continue-on-error: true
        env:
          TODAY_WEBHOOK_URL: ${{ secrets.TODAY_WEBHOOK_URL }}
          TODAY_ICS_URLS: ${{ secrets.TODAY_ICS_URLS }}
          FOOD_ICS_URL: ${{ secrets.FOOD_ICS_URL }}
          BIRTHDAYS_ICS_URL: ${{ secrets.BIRTHDAYS_ICS_URL }}
          TODAY_COUNTDOWNS: ${{ secrets.TODAY_COUNTDOWNS }}
          SHINY_WEBHOOK_URL: ${{ secrets.SHINY_WEBHOOK_URL }}
        run: |
          pip install -q recurring-ical-events || echo "iCal libraries unavailable"
          python3 hub_bot.py

      - name: MTGCompare price drops
        continue-on-error: true
        env:
          DEALS_DISCORD_WEBHOOK_URL: ${{ secrets.DEALS_DISCORD_WEBHOOK_URL }}
        run: python mtgcompare_bot.py

      - name: Post new trophies
        continue-on-error: true
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          TROPHIES_WEBHOOK_URL: ${{ secrets.TROPHIES_WEBHOOK_URL }}
          RECAP_WEBHOOK_URL: ${{ secrets.FREE_GAMES_WEBHOOK_URL }}   # weekly recap goes to #gaming
        run: |
          if [ -n "$PSN_NPSSO" ] && [ -n "$TROPHIES_WEBHOOK_URL" ]; then
            npm install --no-save --no-package-lock --silent psn-api@2 && node trophies_bot.mjs
          else
            echo "PSN_NPSSO or TROPHIES_WEBHOOK_URL not set; skipping trophies"
          fi

      - name: Restore price history
        uses: actions/cache/restore@v4
        with:
          path: price_history
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: Post price alerts
        continue-on-error: true
        env:
          PRICE_ALERTS_WEBHOOK_URL: ${{ secrets.PRICE_ALERTS_WEBHOOK_URL }}
        run: python3 price_bot.py

      - name: Save price history
        if: hashFiles('price_history/UPDATED') != ''
        uses: actions/cache/save@v4
        with:
          path: price_history
          key: prices-${{ github.run_id }}

      - name: Save seen cards
        run: |
          git config user.name "spoiler-bot"
          git config user.email "spoiler-bot@users.noreply.github.com"
          git add seen.json
          for f in posted_deals.json deals_thread.txt arena_seen.json arena_thread.txt pogo_seen.json free_games_seen.json trophies_state.json rss_seen.json mtgcompare_seen.json hub_state.json game_state.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || (git commit -m "Update seen cards" && git push)

      - name: Alert after 3 failed runs in a row
        if: failure()
        env:
          HEALTH_WEBHOOK_URL: ${{ secrets.HEALTH_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$HEALTH_WEBHOOK_URL" ]; then echo "HEALTH_WEBHOOK_URL not set"; exit 0; fi
          # This run is still in progress, so look at the last completed runs:
          # alert only when the previous two failed and the one before that didn't,
          # i.e. this is exactly the third failure in a row (no repeat alerts).
          set -- $(gh run list -R "$GITHUB_REPOSITORY" -w spoilers.yml -s completed -L 3 --json conclusion -q '.[].conclusion')
          if [ "$1" = failure ] && [ "$2" = failure ] && [ "$3" != failure ]; then
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            curl -sS -H "Content-Type: application/json" \
              -d "{\"username\":\"Bot Health\",\"content\":\"MTG Spoilers bot has failed 3 runs in a row. Latest run: $url\"}" \
              "$HEALTH_WEBHOOK_URL"
          else
            echo "Not the third failure in a row; no alert"
          fi
