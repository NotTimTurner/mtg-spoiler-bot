name: MTG Spoilers

on:
  schedule:
    - cron: "7,27,47 * * * *"   # every 20 minutes, offset from the busy top of the hour
  workflow_dispatch:             # lets you run it manually from the Actions tab

permissions:
  contents: write                # needed to save seen.json back to the repo

concurrency:
  group: spoilers
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main              # always use the latest repo state, even on re-runs

      - name: Post new spoilers
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 spoiler_bot.py

      - name: Post new deals
        continue-on-error: true      # deals problems never block spoilers
        env:
          DEALS_DISCORD_WEBHOOK_URL: ${{ secrets.DEALS_DISCORD_WEBHOOK_URL }}
        run: python3 deals_bot.py

      - name: Post Pokémon GO events
        continue-on-error: true
        env:
          POKEMON_GO_WEBHOOK_URL: ${{ secrets.POKEMON_GO_WEBHOOK_URL }}
        run: python3 pogo_bot.py

      - name: Post free games
        continue-on-error: true
        env:
          FREE_GAMES_WEBHOOK_URL: ${{ secrets.FREE_GAMES_WEBHOOK_URL }}
        run: python3 free_games_bot.py

      - name: Post new trophies
        continue-on-error: true
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          TROPHIES_WEBHOOK_URL: ${{ secrets.TROPHIES_WEBHOOK_URL }}
        run: |
          if [ -n "$PSN_NPSSO" ] && [ -n "$TROPHIES_WEBHOOK_URL" ]; then
            npm install --no-save --no-package-lock --silent psn-api@2 && node trophies_bot.mjs
          else
            echo "PSN_NPSSO or TROPHIES_WEBHOOK_URL not set; skipping trophies"
          fi

      - name: Save seen cards
        run: |
          git config user.name "spoiler-bot"
          git config user.email "spoiler-bot@users.noreply.github.com"
          git add seen.json
          for f in posted_deals.json pogo_seen.json free_games_seen.json trophies_state.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || (git commit -m "Update seen cards" && git push)
